# Local F01 acceptance only. No .env, cloud provider or production Auth bypass.
# DB shares api network namespace so the existing disposable loopback guard applies.
services:
  api:
    build:
      context: .
      dockerfile: infra/test/oauth.Dockerfile
    command: ["node", "apps/api/test/oauth-browser-fixture.mjs"]
    environment:
      TEST_DATABASE_URL: postgresql://examate_test:local-test-only@127.0.0.1:5432/examate_test
      DATABASE_SSL: "false"
      DATABASE_CA_CERT_PATH: ""
      FIXTURE_ORIGIN: http://127.0.0.1:8080
      FIXTURE_LISTEN_HOST: 0.0.0.0
      PUBLIC_ORIGIN: http://127.0.0.1:8080
      ALLOWED_ORIGINS: http://127.0.0.1:8080
      TRUSTED_PROXY_IP: 172.30.250.10
    volumes:
      - ./infra/postgres:/workspace/infra/postgres:ro
    stdin_open: true
    init: true
    stop_grace_period: 25s
    networks:
      pilot:
        ipv4_address: 172.30.250.20
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 30
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    network_mode: service:api
    depends_on:
      api:
        condition: service_started
    environment:
      POSTGRES_DB: examate_test
      POSTGRES_USER: examate_test
      POSTGRES_PASSWORD: local-test-only
    tmpfs:
      - /var/lib/postgresql/data:rw,size=512m,uid=999,gid=999
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    networks:
      pilot:
        ipv4_address: 172.30.250.10
networks:
  pilot:
    ipam:
      config:
        - subnet: 172.30.250.0/24
