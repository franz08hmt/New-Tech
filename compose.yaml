name: examate-non-ai
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      TRUSTED_PROXY_IP: 172.30.250.10
      PUBLIC_ORIGIN: ${DOCKER_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      ALLOWED_ORIGINS: ${DOCKER_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
    volumes:
      - ./secrets:/run/secrets:ro
    init: true
    networks:
      pilot:
        ipv4_address: 172.30.250.20
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 8s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    networks:
      pilot:
        ipv4_address: 172.30.250.10
networks:
  pilot:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/24
