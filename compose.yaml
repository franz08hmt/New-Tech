name: coursemate-ai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: coursemate
      POSTGRES_USER: coursemate
      POSTGRES_PASSWORD: coursemate
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursemate -d coursemate"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "55432:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://coursemate:coursemate@db:5432/coursemate
      AI_PROVIDER: disabled
      AI_TIMEOUT_MS: 20000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres-data:
