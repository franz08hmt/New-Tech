name: examate-local-db
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: examate_test
      POSTGRES_USER: examate_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examate_test -d examate_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  test-postgres-data:
