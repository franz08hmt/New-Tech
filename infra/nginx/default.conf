# Never log arbitrary paths, callback queries or request headers.
map $uri $examate_safe_path {
    default /redacted;
    ~^/api/auth/(session|login|logout|refresh|google/(status|start|callback))$ $uri;
    /api/health /api/health;
}
log_format examate_safe '$request_method $examate_safe_path $status';
access_log /var/log/nginx/access.log examate_safe;
error_log /dev/null crit;
server {
    # OAuth query can contain credentials. Do not log callback request lines.
    location = /api/auth/google/callback {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    client_body_timeout 30s;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # One trusted hop: discard all client-supplied forwarded identities.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
